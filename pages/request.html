  <meta name="keywords" content="طلب خدمة, مشاريع تخرج, واتساب, ركن العطاء">
  <meta property="og:title" content="اطلب خدمتك | ركن العطاء">

<body>
  <noscript><div class="noscript">لتصفح الموقع بالكامل فعّل JavaScript. للتواصل: +967 735 962 962</div></noscript>
  <a class="skip" href="#main">تخطي إلى المحتوى</a>
  <main id="main" class="container page-hero">
    <nav class="crumbs" aria-label="مسار الصفحة"></nav>
    <h1>اطلب خدمتك</h1>
    <p class="lead">عبّئ البيانات بدقة لنراجع طلبك بسرعة. لا يوجد إرسال إلى خادم؛ بعد التحقق يمكنك فتح واتساب برسالة جاهزة.</p>
    <form class="form" id="requestForm" novalidate>
      <div class="form-row">
        <label>الاسم
          <input name="fullname" required autocomplete="name">
          <small class="error">يرجى إدخال الاسم</small>
        </label>
        <label>رقم الهاتف
          <input name="phone" required inputmode="tel" autocomplete="tel">
          <small class="error">يرجى إدخال رقم هاتف صحيح</small>
        </label>
      </div>
      <div class="form-row">
        <label>الجامعة
          <input name="university" required>
          <small class="error">يرجى إدخال الجامعة</small>
        </label>
        <label>التخصص
          <input name="spec" required>
          <small class="error">يرجى إدخال التخصص</small>
        </label>
      </div>
      <div class="form-row">
        <label>نوع الخدمة
          <select name="service" required></select>
          <small class="error">يرجى اختيار الخدمة</small>
        </label>
        <label>الموعد المطلوب
          <input name="deadline" type="date">
        </label>
      </div>
      <label>تفاصيل الطلب
        <textarea name="details" rows="6" required placeholder="اكتب فكرة المشروع، عدد الصفحات، لغة العمل، أو أي متطلبات خاصة."></textarea>
        <small class="error">يرجى كتابة تفاصيل الطلب</small>
      </label>
      <label>ملاحظات
        <textarea name="notes" rows="3"></textarea>
      </label>
      <button class="btn btn-primary" type="submit">إرسال الطلب</button>
      <div class="success-box" id="successBox">
        تم التحقق من بياناتك بنجاح. اضغط الزر التالي لإرسال الطلب عبر واتساب.
        <p><a class="btn btn-accent" id="waSend" href="#" target="_blank" rel="noopener">إرسال عبر واتساب</a></p>
      </div>
    </form>
  </main>
  <script src="../assets/js/data.js?v=20260903" defer></script>
  <script src="../assets/js/app.js?v=20260903" defer></script>
