  <main id="main" class="container page-hero">
    <nav class="crumbs" aria-label="مسار الصفحة"></nav>
    <h1>تواصل معنا</h1>
    <p class="lead">ركن العطاء للخدمات الطلابية — نرد عليك عبر الهاتف أو واتساب أو النموذج.</p>
    <div class="cards-3">
      <article class="card"><h3>الهاتف</h3><p id="contactPhone"></p></article>
      <article class="card"><h3>واتساب</h3><p id="contactWaCard"></p></article>
      <article class="card"><h3>البريد</h3><p id="contactMail"></p></article>
    </div>
    <details class="fold page-fold" id="message">
      <summary>أرسل رسالة عبر النموذج</summary>
      <form class="form fold-body" id="contactForm" novalidate>
        <h2>أرسل رسالة</h2>
        <label>الاسم
          <input name="fullname" required autocomplete="name">
          <small class="error">يرجى إدخال الاسم</small>
        </label>
        <label>رقم الهاتف
          <input name="phone" required inputmode="tel" autocomplete="tel">
          <small class="error">يرجى إدخال رقم الهاتف</small>
        </label>
        <label>الرسالة
          <textarea name="message" rows="5" required></textarea>
          <small class="error">يرجى كتابة الرسالة</small>
        </label>
        <button class="btn btn-primary" type="submit">إرسال الرسالة</button>
        <div class="success-box" id="contactSuccess">
          تم تجهيز رسالتك. يمكنك إرسالها عبر واتساب الآن.
          <p><a class="btn btn-accent" id="contactWa" href="#" target="_blank" rel="noopener">إرسال عبر واتساب</a></p>
        </div>
      </form>
    </details>
